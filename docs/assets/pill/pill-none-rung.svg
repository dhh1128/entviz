ot;, monospace" font-size="21.666666666666668px" font-weight="normal" text-anchor="middle" fill="#2b2b33">m</text><text x="257.50" y="140.72" font-family="&quot;JetBrains Mono&quot;, &quot;Menlo&quot;, &quot;Consolas&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, &quot;Roboto Mono&quot;, &quot;Noto Sans Mono&quot;, monospace" font-size="21.666666666666668px" font-weight="normal" text-anchor="middle" fill="#2b2b33">B</text><text x="270.50" y="140.72" font-family="&quot;JetBrains Mono&quot;, &quot;Menlo&quot;, &quot;Consolas&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, &quot;Roboto Mono&quot;, &quot;Noto Sans Mono&quot;, monospace" font-size="21.666666666666668px" font-weight="normal" text-anchor="middle" fill="#2b2b33">x</text><text x="30.00" y="166.00" font-family="'DejaVu Sans', 'Bitstream Vera Sans', Verdana, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" fill="#5a5f6a">the same widths, in braille and blocks</text><text x="30.00" y="202.00" font-family="'DejaVu Sans', 'Bitstream Vera Sans', Verdana, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" fill="#5a5f6a">A braille cell is 256 code points where a block glyph is 9. Dots fill 7, 8, 3, 6, 2, 5, 1, 4, so a glyph's dot COUNT is its fill height —</text><text x="30.00" y="220.00" font-family="'DejaVu Sans', 'Bitstream Vera Sans', Verdana, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" fill="#5a5f6a">the bar's ordinal reading survives as density, and which arrangement of that many dots gets drawn is free. That is where the color assignment goes.</text><text x="36.50" y="277.00" font-family="&quot;JetBrains Mono&quot;, &quot;Menlo&quot;, &quot;Consolas&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, &quot;Roboto Mono&quot;, &quot;Noto Sans Mono&quot;, monospace" font-size="12px" font-weight="normal" text-anchor="middle" fill="#5a5f6a">0/8</text><circle cx="58.90" cy="257.58" r="1.95" fill="#2b